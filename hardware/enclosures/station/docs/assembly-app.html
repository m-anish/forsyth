<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a workbench. Step list on the left (a drawer on phones), the current step on the right;
   progress for the chosen build lives in the header. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #1d2530; --muted: #5b6676; --rule: #d6dce4;
  --accent: #33597f; --accent-fg: #ffffff; --accent-soft: #e3ecf5; --done: #2f7a46; --done-soft: #e3f3e8;
  --warn: #8a4b08; --warn-bg: #fdf3e4; --warn-rule: #e9c48f; --bad: #a12020; --bad-bg: #fdecec;
  --display: "Fraunces", Georgia, serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --panel: #1a2029; --fg: #e3e8ef; --muted: #9aa6b6; --rule: #2d3745;
  --accent: #8fb4d6; --accent-fg: #0f1823; --accent-soft: #213246; --done: #7fd39a; --done-soft: #1c3426;
  --warn: #f0c27a; --warn-bg: #2d2416; --warn-rule: #6b5124; --bad: #ff9b9b; --bad-bg: #351c1c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #1a2029; --fg: #e3e8ef; --muted: #9aa6b6; --rule: #2d3745;
  --accent: #8fb4d6; --accent-fg: #0f1823; --accent-soft: #213246; --done: #7fd39a; --done-soft: #1c3426;
  --warn: #f0c27a; --warn-bg: #2d2416; --warn-rule: #6b5124; --bad: #ff9b9b; --bad-bg: #351c1c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font: 0.88em var(--mono); background: var(--accent-soft); padding: 0.05em 0.3em; border-radius: 3px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel);
  border-bottom: 1px solid var(--rule);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font: 600 1.15rem var(--display); margin-right: auto; display: flex; align-items: center; gap: 10px; }
.mark-f { width: 2.3rem; height: 2.3rem; flex: none; }
.mark-sl { width: 1.2rem; height: 1.2rem; flex: none; color: var(--fg); }
.mark-sl .sl-sprout { fill: var(--bg); }
footer.made { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 0.85rem;
  padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
footer.made a { color: inherit; }
.brand small { display: block; font: 500 0.7rem var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.buildpick { display: flex; gap: 6px; align-items: center; }
.buildpick select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); max-width: 14rem; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 12px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.done { background: var(--done); color: var(--panel); border-color: var(--done); font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.progress { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.85rem; color: var(--muted);
  font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width 0.3s; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; font-size: 0.88rem; }
.links a { color: var(--accent); }
.links .who { margin-left: auto; color: var(--muted); }
.team { list-style: none; margin: 0 0 16px; padding: 0; }
.team li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.team li .em { flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; }
.team .role { font: 600 0.75rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.formrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0 16px; }
.formrow label.f { flex: 1 1 14rem; }
.formrow select { padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
nav.tabs { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--fg); }
.status { font-size: 0.8rem; color: var(--muted); }
.status.warn { color: var(--warn); }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; max-width: 1280px; margin: 0 auto;
  padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside.steps { position: sticky; top: 150px; align-self: start; max-height: calc(100vh - 170px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 0; }
aside.steps details { border-bottom: 1px solid var(--rule); }
aside.steps details:last-child { border-bottom: 0; }
aside.steps summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 0.92rem; }
aside.steps summary::-webkit-details-marker { display: none; }
aside.steps summary span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
aside.steps summary.complete span { color: var(--done); }
aside.steps ol { list-style: none; margin: 0 0 6px; padding: 0; }
aside.steps li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 12px 5px 14px;
  display: grid; grid-template-columns: 1.3rem 2.4rem minmax(0, 1fr); gap: 4px; font-size: 0.88rem; align-items: baseline; }
aside.steps li button:hover { background: var(--accent-soft); }
aside.steps li button[aria-current="step"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.tick { width: 1rem; height: 1rem; border: 1.5px solid var(--muted); border-radius: 4px; display: inline-grid; place-items: center;
  font-size: 0.7rem; line-height: 1; color: var(--panel); align-self: center; }
.tick.on { background: var(--done); border-color: var(--done); }
.tick.warn { border-color: var(--bad); }
.sno { font: 500 0.8rem var(--mono); color: var(--muted); }
#drawerBtn { display: none; }

.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; min-width: 0; }
.stephead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; margin-bottom: 12px; }
.stephead .no { font: 600 1rem var(--mono); color: var(--accent); }
.stephead h2 { font: 600 1.45rem/1.2 var(--display); margin: 0; text-wrap: balance; flex: 1 1 16rem; }
.secname { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); width: 100%; }
figure { margin: 0 0 12px; }
figure .pic { background: #fff; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
figure svg { display: block; width: 100%; height: auto; }
figcaption { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 0.88rem; }
figcaption span { display: inline-flex; gap: 6px; align-items: center; }
.ball { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: #2b4766;
  color: #fff; font: 600 0.75rem var(--body); flex: none; }
.cols { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 18px; }
h4 { font: 600 0.72rem/1.3 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.4em; }
.need ul { list-style: none; padding: 0; margin: 0 0 12px; font-size: 0.9rem; }
.need li { padding: 3px 0; border-bottom: 1px dotted var(--rule); display: flex; justify-content: space-between; gap: 8px; }
.need li b { font: 600 0.82rem var(--mono); white-space: nowrap; }
.do ol { margin: 0; padding-left: 1.3em; }
.do li { margin-bottom: 0.45em; }
dl.nums { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 4px 14px; margin: 14px 0 0; padding: 10px 12px;
  background: var(--accent-soft); border-radius: 6px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
dl.nums dt { color: var(--muted); } dl.nums dd { margin: 0; }
.flag { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn-rule); background: var(--warn-bg); font-size: 0.9rem; border-radius: 0 6px 6px 0; }
.flag::before { content: "Open in the model: "; font-weight: 600; color: var(--warn); }
.flag.bench { border-left-color: var(--accent); background: var(--accent-soft); }
.flag.bench::before { content: "Check on the bench: "; color: var(--accent); }
.flag.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.flag.bad::before { content: "Problem: "; color: var(--bad); }
.log { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 10px; }
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
label.f { display: grid; gap: 3px; font-size: 0.85rem; color: var(--muted); }
label.f input, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--fg); }
textarea { min-height: 4.5em; resize: vertical; }
.calc { font-size: 0.9rem; color: var(--done); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .stamp { font-size: 0.85rem; color: var(--muted); margin-right: auto; }
.nav2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); display: grid; }
.card .img { background: #fff; } .card img { display: block; width: 100%; height: auto; }
.card .meta { padding: 8px 10px; display: grid; gap: 6px; font-size: 0.86rem; }
.card .meta code { background: transparent; padding: 0; font-weight: 600; word-break: break-all; }
.stepper { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.stepper button { width: 1.9rem; height: 1.9rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.stepper .n { min-width: 3.2rem; text-align: center; }
.stepper .n.full { color: var(--done); font-weight: 600; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 0.86rem; }
.hwlist { list-style: none; margin: 0; padding: 0; }
.hwlist li { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.hwlist li span { flex: 1; min-width: 0; } .hwlist li b { font: 600 0.85rem var(--mono); }
.hwlist small { color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; }
.empty h2 { font: 600 1.4rem var(--display); }
.empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.empty input { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.issues li { margin-bottom: 10px; }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  aside.steps { position: static; max-height: none; display: none; }
  aside.steps.open { display: block; }
  #drawerBtn { display: inline-block; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  dl.nums { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

<script>
const DATA = {"generated":"2026-11-19 22:52","rain_ml_per_mm":9.503,"sections":[{"id":"wind-housing","no":1,"title":"Wind housing","intro":"The housing carries both wind sensors: the cups hang from bearings in its floor and the vane turns on its lid. Build the bottom half here. The README says to print <code>wind_lid<\/code> first and check that a bearing fits its pocket before printing the body. The housing has no opinion about the wind; it only has to stay dry while finding out.","steps":[{"id":"wind-01-inserts","no":"1.1","title":"Heat-set inserts in the housing ears","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"wind-01-inserts\"><image href=\"assembly/wind-01-inserts.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"301.0\" y1=\"307.5\" x2=\"570.0\" y2=\"307.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"570.0\" cy=\"307.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"14.0\" y=\"317.5\" font-size=\"28\" font-weight=\"700\" fill=\"#1d2530\" text-anchor=\"start\" stroke=\"#fff\" stroke-width=\"6\" paint-order=\"stroke\" font-family=\"Helvetica, Arial, sans-serif\">M3 heat-set insert<\/text><\/g><g><line x1=\"161.5\" y1=\"403.5\" x2=\"501.5\" y2=\"403.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"501.5\" cy=\"403.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"14.0\" y=\"413.5\" font-size=\"28\" font-weight=\"700\" fill=\"#1d2530\" text-anchor=\"start\" stroke=\"#fff\" stroke-width=\"6\" paint-order=\"stroke\" font-family=\"Helvetica, Arial, sans-serif\">wind_body<\/text><\/g><\/svg>","legend":["wind_body","M3 heat-set insert"],"printed":[["wind_body",1]],"hw":[["M3 x 6 brass heat-set insert, OD 4.2",3]],"do":["Press one insert into each of the three ears on the housing rim, from the top, with a soldering iron and an insert tip. Keep it square and stop when its top face is flush with the rim.","Let each one cool before the next. The lid screws pull on these."],"nums":[["Insert pilot","&Oslash;3.8, 7&nbsp;mm deep"],["Insert length","6&nbsp;mm, so 1&nbsp;mm of hole is left under it"],["Ears","radius 35.6&nbsp;mm, at 60, 180, 300&deg;"]],"flags":[],"record":[]},{"id":"wind-02-bearings","no":"1.2","title":"Bearings and spacer in the floor tower","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"wind-02-bearings\"><image href=\"assembly/wind-02-bearings.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"72.0\" y1=\"415.0\" x2=\"591.0\" y2=\"415.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"591.0\" cy=\"415.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"42.0\" cy=\"415.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"42.0\" y=\"426.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">2<\/text><\/g><g><line x1=\"1128.0\" y1=\"303.0\" x2=\"612.0\" y2=\"303.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"612.0\" cy=\"303.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"303.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"314.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">1<\/text><\/g><\/svg>","legend":["bearing","wind_spacer"],"printed":[["wind_spacer",1]],"hw":[["Ball bearing 5 x 16 x 5, shielded (625ZZ)",2],["Isopropyl alcohol, 99% (cleans the cup bearings)",1],["Light oil: sewing-machine, clock or instrument",1]],"do":["These two carry the cups. They arrive packed with grease, which is enough to stall a light breeze, so clean them before they go in. The vane's pair (step 3.1) can stay as they come.","Leave the shields on. A ZZ shield does not touch the inner race, so solvent gets in round it; prising one off usually bends it, and outdoors it keeps the grit out.","Thread each bearing onto an M5 screw and spin it under 99% isopropyl alcohol (naphtha also works) in a small jar. Change the alcohol two or three times, until it stays clear and the bearing runs on instead of slowing at once. Not 70%: its water rusts the races.","Let them dry for 15 to 30 minutes, or under a hairdryer on low. If you use compressed air, hold the inner race: a dry bearing spun up by air wears its own races.","Oil them straight away, before the air does its work: one small drop of light oil on each side, a spin to spread it, the excess wiped off. More oil is only more drag and more dust.","Press the first bearing into the pocket that opens under the floor, until its outer race stops on the shoulder inside the tower.","Drop a <code>wind_spacer<\/code> into the tower from above. It stands on the lower bearing's inner race.","Press the second bearing in from above, again down to the shoulder.","Push on the outer race only: a socket the size of the race works. Pressing on the inner race or the shields damages the bearing.","Both should spin freely. If a pocket is too loose or too tight, change <code>brg_fit<\/code> in <code>params.py<\/code> and reprint; this is why the README says to print <code>wind_lid<\/code> first and check the fit."],"nums":[["Bearing pocket","&Oslash;16.1 for a 16&nbsp;mm bearing (0.1&nbsp;mm over), 5&nbsp;mm deep"],["A clean, oiled bearing","runs for several seconds after a flick on a screw, smooth, not gritty"],["Shoulder between the pockets","&Oslash;12.92&nbsp;mm"],["Bearing faces apart","8&nbsp;mm"],["Spacer","&Oslash;7.6 outside, &Oslash;5.3 bore, 8.3&nbsp;mm long"]],"flags":[],"record":[["fit","Bearing fit in the housing (snug / loose / tight)",""]]},{"id":"wind-03-reed","no":"1.3","title":"Anemometer reed switch","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"wind-03-reed\"><image href=\"assembly/wind-03-reed.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"72.0\" y1=\"402.0\" x2=\"439.0\" y2=\"402.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"439.0\" cy=\"402.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"42.0\" cy=\"402.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"42.0\" y=\"413.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">1<\/text><\/g><\/svg>","legend":["reed switch"],"printed":[],"hw":[["Reed switch, 14 mm glass",1],["Neutral-cure silicone",1]],"do":["Solder two wires to the reed switch. Bend its leads well away from the glass, never at the seal.","Lay it in the channel on the housing floor, on the side away from the arm, between the two cradles, with the glass centred 18.7&nbsp;mm from the axis and the leads toward the wall.","Hold it down with a dab of neutral-cure silicone on the leads, not on the glass.","Lead the wires up the wall to where the vane PCB (Board D) will sit: they go to its anemometer reed pads, SW9 in <code>hardware/boards/board-d-wind.md<\/code>."],"nums":[["Reed centre from the axis","18.7&nbsp;mm"],["Channel","2.7&nbsp;mm wide, open on top, its floor 0.4&nbsp;mm above the housing floor"],["Magnet to reed, through the floor","7.6&nbsp;mm centre to centre"]],"flags":[],"record":[]},{"id":"wind-04-gland","no":"1.4","title":"Cable gland","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"wind-04-gland\"><image href=\"assembly/wind-04-gland.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"72.0\" y1=\"403.5\" x2=\"504.0\" y2=\"403.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"504.0\" cy=\"403.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"42.0\" cy=\"403.5\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"42.0\" y=\"414.9\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">3<\/text><\/g><g><line x1=\"1128.0\" y1=\"437.5\" x2=\"739.5\" y2=\"437.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"739.5\" cy=\"437.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"437.5\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"448.9\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">2<\/text><\/g><g><line x1=\"1128.0\" y1=\"523.0\" x2=\"852.5\" y2=\"523.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"852.5\" cy=\"523.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"523.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"534.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">1<\/text><\/g><\/svg>","legend":["PG7 gland","tpu_washer_gland","gland locknut"],"printed":[["tpu_washer_gland",1]],"hw":[["PG7 cable gland",1],["Shielded 5-core outdoor cable (wind), mast height + 0.5 m",1]],"do":["The gland goes in the wall that faces the mast, between the arm's two rails.","From outside: the TPU washer, then the gland through the wall. From inside: its locknut, flat against the seat cut into the wall.","Feed the 5-core cable in now and leave the dome nut loose. Tighten it after the lid is on (step 4.2)."],"nums":[["Hole","&Oslash;12.5, centre 14&nbsp;mm above the housing's underside"],["TPU washer","&Oslash;20 outside, &Oslash;12.7 hole, 1&nbsp;mm thick"],["Wall under the flange","3&nbsp;mm (a flat seat inside takes the locknut); 4&nbsp;mm with the washer"],["Thread left for the locknut","4&nbsp;mm of a 8&nbsp;mm PG7 thread (Flyrobo lists 9)"]],"flags":[],"record":[]}]},{"id":"anemometer","no":2,"title":"Anemometer","intro":"Three cups on a hub, clamped to an M5 x 40 screw that turns in the floor tower's bearings. It will count every gust, including the ones nobody asked about.","steps":[{"id":"cups-01-hub","no":"2.1","title":"Magnet and nut into the hub","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"cups-01-hub\"><image href=\"assembly/cups-01-hub.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"208.0\" y1=\"91.5\" x2=\"350.0\" y2=\"91.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"350.0\" cy=\"91.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"14.0\" y=\"101.5\" font-size=\"28\" font-weight=\"700\" fill=\"#1d2530\" text-anchor=\"start\" stroke=\"#fff\" stroke-width=\"6\" paint-order=\"stroke\" font-family=\"Helvetica, Arial, sans-serif\">magnet 6 x 2<\/text><\/g><g><line x1=\"130.5\" y1=\"415.0\" x2=\"558.5\" y2=\"415.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"558.5\" cy=\"415.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"14.0\" y=\"425.0\" font-size=\"28\" font-weight=\"700\" fill=\"#1d2530\" text-anchor=\"start\" stroke=\"#fff\" stroke-width=\"6\" paint-order=\"stroke\" font-family=\"Helvetica, Arial, sans-serif\">cup_hub<\/text><\/g><g><line x1=\"1085.0\" y1=\"561.0\" x2=\"893.0\" y2=\"561.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"893.0\" cy=\"561.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"1186.0\" y=\"571.0\" font-size=\"28\" font-weight=\"700\" fill=\"#1d2530\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"6\" paint-order=\"stroke\" font-family=\"Helvetica, Arial, sans-serif\">M5 nut<\/text><\/g><\/svg>","legend":["cup_hub","magnet 6 x 2","M5 nut"],"printed":[["cup_hub",1]],"hw":[["Disc magnet 6 x 2",1],["M5 hex nut",1],["Two-part epoxy (for the magnets)",1]],"do":["The hub's top is the face with the small raised lip round the bore.","Push a 6 x 2 magnet into the slot in that face, standing on its edge, flat faces toward and away from the axis. Either pole outward works: a reed closes for both.","Fix the magnet with a drop of epoxy: its slot is a clearance fit.","Slide an M5 nut into the slot in the hub's side until it sits over the bore. Its flats run along the slot walls."],"nums":[["Magnet slot","6.2 across, 2.2 along the radius, 6.3 deep, at radius 18.7&nbsp;mm"],["Nut slot","8.3 wide, 4.4 tall, its top 3.5&nbsp;mm below the hub's top face"]],"flags":[],"record":[]},{"id":"cups-02-arms","no":"2.2","title":"Arms and cap (seen from below)","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"cups-02-arms\"><image href=\"assembly/cups-02-arms.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"72.0\" y1=\"600.0\" x2=\"548.0\" y2=\"600.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"548.0\" cy=\"600.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"42.0\" cy=\"600.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"42.0\" y=\"611.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">2<\/text><\/g><g><line x1=\"1128.0\" y1=\"554.0\" x2=\"883.0\" y2=\"554.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"883.0\" cy=\"554.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"554.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"565.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">1<\/text><\/g><g><line x1=\"1128.0\" y1=\"675.5\" x2=\"604.0\" y2=\"675.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"604.0\" cy=\"675.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"675.5\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"686.9\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">3<\/text><\/g><\/svg>","legend":["cup_arm","cup_hub_cap","M3 x 10"],"printed":[["cup_arm",3],["cup_hub_cap",1]],"hw":[["M3 x 10 socket head",3]],"do":["Turn the hub over. Push each <code>cup_arm<\/code> straight up into a slot from the hub's underside. The hook on the arm's inner end only goes in one way round and only from below; it will not slide in from the side.","All three cups then face the same way round.","Lay <code>cup_hub_cap<\/code> over the slots and drive three M3 x 10 through it into the pilot holes. They cut their own thread: go slowly and stop when the cap is tight."],"nums":[["Pilot holes","&Oslash;2.5, 9 mm deep, at radius 10&nbsp;mm"],["Thread in the hub","7.6&nbsp;mm (10 mm screw, 2.4&nbsp;mm cap)"],["Cups sweep","radius 82&nbsp;mm"]],"flags":[],"record":[]},{"id":"cups-03-shaft","no":"2.3","title":"Hang the rotor from the housing","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"cups-03-shaft\"><image href=\"assembly/cups-03-shaft.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"72.0\" y1=\"241.5\" x2=\"599.5\" y2=\"241.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"599.5\" cy=\"241.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"42.0\" cy=\"241.5\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"42.0\" y=\"252.9\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">2<\/text><\/g><g><line x1=\"1128.0\" y1=\"306.5\" x2=\"614.5\" y2=\"306.5\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"614.5\" cy=\"306.5\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"306.5\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"317.9\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">1<\/text><\/g><g><line x1=\"1128.0\" y1=\"701.0\" x2=\"798.5\" y2=\"701.0\" stroke=\"#2b4766\" stroke-width=\"2.5\"/><circle cx=\"798.5\" cy=\"701.0\" r=\"6\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"1158.0\" cy=\"701.0\" r=\"30\" fill=\"#2b4766\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"1158.0\" y=\"712.4\" font-size=\"33\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica, Arial, sans-serif\">3<\/text><\/g><\/svg>","legend":["wind_shim","M5 x 40 shaft","cup rotor (2.2)"],"printed":[["wind_shim",1]],"hw":[["M5 x 40 socket head (rotor shaft)",1]],"do":["Put a <code>wind_shim<\/code> on an M5 x 40 and drop the screw into the floor tower from inside the housing. The shim sits on the upper bearing's inner race.","From below, push the cup rotor onto the screw, lip first, until the lip meets the lower bearing's inner race.","Hold the rotor and turn the screw from inside with a 4 mm hex key until it catches the nut and pulls the stack together. Stop at snug: shim, both inner races, spacer and hub lip clamped into one piece.","Spin it. It should coast to a stop, not stop dead. If it stops dead, the bearings still hold their grease (step 1.2) or the screw is past snug."],"nums":[["Shim","&Oslash;7.6, &Oslash;5.3 bore, 1.2&nbsp;mm thick"],["Screw past the bearing stack","20.5&nbsp;mm, into a 22&nbsp;mm bore through the nut"],["Cup tops below the housing floor","4&nbsp;mm"]],"flags":[],"record":[["spin","Cups coast after a flick","s"]]}]},{"id":"vane","no":3,"title":"Wind vane","intro":"The vane turns on two more bearings in the lid, on a second M5 x 40 put in from under the lid. The lid and vane come off the housing together: the screw head is the one fastener that passes the vane PCB's centre hole. The vane points at where the wind comes from, which is more than most things in the lab can say.","steps":[{"id":"vane-01-lid","no":"3.1","title":"Bearings and spacer in the lid","svg":"<svg viewBox=\"0 0 1200 900\" role=\"img\" aria-label=\"vane-01-lid\"><image href=\"assembly/vane-01-lid.png\" x=\"0\" y=\"0\" width=\"1200\" height=\"900\"/><g><line x1=\"192.5\" y1=\"333.0\" x2=\"572.5\" y2=\"333.0\" stroke=\"#2b476   for (const id of ids) {
    const b = state.builds[id], o = el("option", { value: id });
    o.textContent = (b.name || id) + (state.kind === "api" && b.role !== "owner" ? " (shared by " + (b.owner || "?") + ")" : "");
    if (id === state.build) o.selected = true; sel.append(o);
  }
  sel.disabled = !ids.length;
  $("newBuildBtn").disabled = state.kind === "api" ? false : (!state.canWrite || state.kind === "signin");
  const d = doneCount();
  $("progTxt").textContent = `${d} of ${STEPS.length} steps done`;
  $("progBar").style.width = (100 * d / STEPS.length).toFixed(1) + "%";
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  renderList();
  const v = $("view");
  const keepScroll = v.dataset.for === state.tab + ":" + state.current + ":" + state.build;
  const focusId = document.activeElement && document.activeElement.id;
  const typed = focusId && /INPUT|TEXTAREA/.test(document.activeElement.tagName) ? document.activeElement.value : null;
  v.textContent = "";
  if (state.kind === "signin") v.append(signInView());
  else if (!state.build) v.append(emptyView());
  else if (state.tab === "team" && state.kind === "api") v.append(teamView());
  else if (state.tab === "parts") v.append(partsView());
  else if (state.tab === "hardware") v.append(hwView());
  else if (state.tab === "issues") v.append(issuesView());
  else v.append(stepView(BY_ID[state.current]));
  v.dataset.for = state.tab + ":" + state.current + ":" + state.build;
  if (keepScroll && focusId && $(focusId)) { const f = $(focusId); if (typed != null && f.type !== "checkbox") f.value = typed; f.focus(); if (f.setSelectionRange && f.value != null) { try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} } }
  namesFor(Object.values(state.steps).map(s => s.by));
}

function renderList() {
  const list = $("stepList"); list.textContent = "";
  for (const sec of DATA.sections) {
    const n = sec.steps.filter(s => state.steps[s.id] && state.steps[s.id].done).length;
    const det = el("details", { open: sec.steps.some(s => s.id === state.current) || n < sec.steps.length ? true : false });
    const sum = el("summary", { class: n === sec.steps.length ? "complete" : "" }, `${sec.no}. ${sec.title}`, el("span", {}, `${n}/${sec.steps.length}`));
    det.append(sum);
    const ol = el("ol");
    for (const st of sec.steps) {
      const on = state.steps[st.id] && state.steps[st.id].done;
      const bad = st.flags.some(f => f.bad);
      const b = el("button", { type: "button", "aria-current": st.id === state.current && state.tab === "steps" ? "step" : false,
        onclick: () => go(st.id) },
        el("span", { class: "tick" + (on ? " on" : "") + (bad && !on ? " warn" : ""), "aria-label": on ? "done" : "not done" }, on ? "✓" : ""),
        el("span", { class: "sno" }, st.no), el("span", {}, st.title));
      ol.append(el("li", {}, b));
    }
    det.append(ol); list.append(det);
  }
}

function go(id) {
  state.current = id; state.tab = "steps";
  try { localStorage.setItem("forsyth-asm-tab", "steps"); } catch (e) {}
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  $("stepList").classList.remove("open");
  render(); window.scrollTo({ top: 0 });
}

function stepView(st) {
  const sec = SECTION_OF[st.id];
  const rec = state.steps[st.id] || {};
  const frag = el("div");
  frag.append(el("div", { class: "stephead" }, el("span", { class: "secname" }, `${sec.no}. ${sec.title}`),
    el("span", { class: "no" }, st.no), el("h2", {}, st.title)));
  if (st.svg) {
    const cap = el("figcaption");
    st.legend.forEach((lab, i) => { if (!st.svg.includes(">" + (i + 1) + "</text>")) return; const s = el("span", {}, el("span", { class: "ball" }, String(i + 1))); s.append(lab); cap.append(s); });
    frag.append(el("figure", {}, el("div", { class: "pic", html: st.svg }), cap));
  }
  const need = el("div", { class: "need" });
  if (st.printed.length) { need.append(el("h4", {}, "Printed")); const ul = el("ul"); st.printed.forEach(([n, q]) => ul.append(el("li", {}, el("span", {}, el("code", {}, n)), el("b", {}, "×" + q)))); need.append(ul); }
  if (st.hw.length) { need.append(el("h4", {}, "Hardware")); const ul = el("ul"); st.hw.forEach(([n, q]) => ul.append(el("li", {}, el("span", {}, n), el("b", {}, "×" + q)))); need.append(ul); }
  if (!st.printed.length && !st.hw.length) need.append(el("h4", {}, "Nothing new"));
  const ol = el("ol"); st.do.forEach(h => ol.append(el("li", { html: h })));
  frag.append(el("div", { class: "cols" }, need, el("div", { class: "do" }, ol)));
  if (st.nums.length) { const dl = el("dl", { class: "nums" }); st.nums.forEach(([a, b]) => { dl.append(el("dt", { html: a }), el("dd", { html: b })); }); frag.append(dl); }
  st.flags.forEach(f => frag.append(el("p", { class: "flag" + (f.bad ? " bad" : "") + (f.bench ? " bench" : ""), html: f.html })));

  // the log: measurements, note, done
  const log = el("div", { class: "log" });
  const ro = !state.canWrite;
  if (st.record.length) {
    const g = el("div", { class: "recgrid" });
    st.record.forEach(([k, lab, unit]) => {
      const inp = el("input", { id: `rec-${st.id}-${k}`, type: "text", value: (rec.values && rec.values[k]) || "", disabled: ro, placeholder: unit || "" });
      inp.addEventListener("change", () => { const r = state.steps[st.id] = { ...(state.steps[st.id] || {}) }; r.values = { ...(r.values || {}), [k]: inp.value.trim() }; saveStep(st.id); render(); });
      g.append(el("label", { class: "f", for: inp.id }, lab + (unit ? ` (${unit})` : ""), inp));
    });
    log.append(el("h4", {}, "Record"), g);
    if (st.id === "rain-05-section") {
      const v = rec.values || {}, ml = parseFloat(v.ml), tips = parseFloat(v.tips);
      if (ml > 0 && tips > 0) { const per = ml / tips; log.append(el("div", { class: "calc" }, `${per.toFixed(2)} ml per tip = ${(per / DATA.rain_ml_per_mm).toFixed(3)} mm of rain per tip`)); }
    }
  }
  const note = el("textarea", { id: `note-${st.id}`, disabled: ro, placeholder: "Notes for this step" });
  note.value = rec.note || "";
  note.addEventListener("change", () => { state.steps[st.id] = { ...(state.steps[st.id] || {}), note: note.value }; saveStep(st.id); });
  log.append(el("label", { class: "f", for: note.id }, "Notes", note));
  const stamp = el("span", { class: "stamp" });
  const whoId = rec._by || rec.by;
  const whoName = state.kind === "api" ? (whoId === state.me ? "you" : whoId) : state.names[whoId];
  const when = rec.at || rec._updated;
  if (rec.done) stamp.textContent = "Done " + (when ? new Date(when).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "") + (whoName ? " by " + whoName : "");
  else stamp.textContent = "Not done yet";
  const btn = el("button", { type: "button", class: "btn " + (rec.done ? "" : "primary"), disabled: ro,
    onclick: () => {
      const r = { ...(state.steps[st.id] || {}) };
      r.done = !r.done; r.at = r.done ? new Date().toISOString() : null; r.by = r.done ? (state.me || null) : null;
      state.steps[st.id] = r; saveStep(st.id);
      if (r.done) { const i = STEPS.indexOf(st); if (i + 1 < STEPS.length) return go(STEPS[i + 1].id); }
      render();
    } }, rec.done ? "Undo done" : "Mark done and go to the next step");
  log.append(el("div", { class: "actions" }, stamp, btn));
  frag.append(log);
  const i = STEPS.indexOf(st);
  frag.append(el("div", { class: "nav2" },
    el("button", { type: "button", class: "btn", disabled: i === 0, onclick: () => go(STEPS[i - 1].id) }, "← Previous"),
    el("button", { type: "button", class: "btn", disabled: i === STEPS.length - 1, onclick: () => go(STEPS[i + 1].id) }, "Next →")));
  return frag;
}

function partsView() {
  const frag = el("div");
  const tot = DATA.parts.reduce((a, p) => a + p.qty, 0);
  const have = DATA.parts.reduce((a, p) => a + Math.min(p.qty, (state.parts[p.name] || {}).printed || 0), 0);
  frag.append(el("div", { class: "stephead" }, el("h2", {}, "Printed parts"), el("span", { class: "status" }, `${have} of ${tot} printed`)));
  const g = el("div", { class: "gallery" });
  for (const p of DATA.parts) {
    const r = state.parts[p.name] || {};
    const n = r.printed || 0;
    const set = (patch) => { state.parts[p.name] = { ...(state.parts[p.name] || {}), ...patch }; savePart(p.name); render(); };
    const fit = el("input", { type: "checkbox", id: "fit-" + p.name, checked: !!r.fit, disabled: !state.canWrite, onchange: e => set({ fit: e.target.checked }) });
    g.append(el("div", { class: "card" },
      el("div", { class: "img" }, el("img", { src: `assembly/part-${p.name}.png`, alt: p.name, loading: "lazy" })),
      el("div", { class: "meta" }, el("code", {}, p.name),
        el("span", { class: "status" }, { white: "white ASA", accent: "accent ASA", tpu: "TPU" }[p.color] + " · need " + p.qty),
        el("div", { class: "stepper" },
          el("button", { type: "button", "aria-label": "One fewer", disabled: !state.canWrite || n <= 0, onclick: () => set({ printed: n - 1 }) }, "−"),
          el("span", { class: "n" + (n >= p.qty ? " full" : "") }, `${n} / ${p.qty}`),
          el("button", { type: "button", "aria-label": "One more", disabled: !state.canWrite, onclick: () => set({ printed: n + 1 }) }, "+")),
        el("label", { class: "chk", for: fit.id }, fit, "Fit checked"))));
  }
  frag.append(g);
  return frag;
}

function hwView() {
  const frag = el("div");
  const n = DATA.hardware.filter(h => (state.hw[slug(h.name)] || {}).have).length;
  frag.append(el("div", { class: "stephead" }, el("h2", {}, "Hardware on hand"), el("span", { class: "status" }, `${n} of ${DATA.hardware.length} items`)));
  const ul = el("ul", { class: "hwlist" });
  for (const h of DATA.hardware) {
    const key = slug(h.name);
    const cb = el("input", { type: "checkbox", id: "hw-" + key, checked: !!(state.hw[key] || {}).have, disabled: !state.canWrite,
      onchange: e => { state.hw[key] = { have: e.target.checked }; saveHw(key); render(); } });
    const lab = el("label", { for: cb.id }, h.name);
    const where = (h.where || []).length ? " · step" + (h.where.length > 1 ? "s " : " ") + h.where.join(", ") : "";
    ul.append(el("li", {}, cb, el("span", {}, lab, el("small", {}, (h.owned ? " · already owned" : "") + where)), el("b", {}, "×" + h.qty)));
  }
  frag.append(ul);
  return frag;
}

function issuesView() {
  const frag = el("div");
  frag.append(el("div", { class: "stephead" }, el("h2", {}, "Checks")));
  frag.append(el("p", {}, STEPS.some(s => s.flags.some(f => !f.bench))
    ? "What the model leaves open, then what only the real parts can answer. Each links to its step."
    : "Nothing is left open in the model. These are the checks only the real parts can answer; each links to its step."));
  const ul = el("ul", { class: "issues" });
  for (const st of STEPS) for (const f of st.flags) {
    const a = el("button", { type: "button", class: "btn", onclick: () => go(st.id) }, st.no);
    ul.append(el("li", {}, a, " ", el("span", { class: "flag" + (f.bad ? " bad" : "") + (f.bench ? " bench" : ""), html: f.html })));
  }
  frag.append(ul);
  return frag;
}

function emptyView() {
  const frag = el("div", { class: "empty" });
  frag.append(el("h2", {}, "Start a build"));
  frag.append(el("p", {}, "A build is one station. Name it, then tick off the " + STEPS.length + " steps as you go. Printed parts and hardware are kept per build, so two stations never borrow each other's screws."));
  if (DATA.overview) frag.append(el("figure", {}, el("div", { class: "pic", html: DATA.overview })));
  const can = state.kind === "api" || state.canWrite;
  const inp = el("input", { id: "newName", type: "text", value: "Station 001", "aria-label": "Build name", disabled: !can });
  frag.append(el("div", { class: "row" }, inp, el("button", { type: "button", class: "btn primary", disabled: !can || !state.loaded, onclick: () => createBuild(inp.value) }, "Start this build")));
  if (state.kind === "api") frag.append(el("p", { class: "status" }, "Builds you start are yours; share one from its Team tab. Builds others share with you appear in the Build list."));
  if (!state.loaded) frag.append(el("p", { class: "status" }, "Loading saved builds…"));
  return frag;
}

function signInView() {
  const frag = el("div", { class: "empty" });
  frag.append(el("h2", {}, "Sign in to track a build"));
  frag.append(el("p", {}, "The tracker keeps each person's builds and shares them with their team, so it needs to know who you are. The guide and PDFs above stay open to everyone."));
  frag.append(el("div", { class: "row" }, el("a", { class: "btn primary", href: "https://build.forsyth.starstucklab.com/app/" }, "Sign in")));
  return frag;
}

function teamView() {
  const frag = el("div");
  const b = state.builds[state.build] || {};
  const owner = state.role === "owner";
  const act = async (fn, okMsg) => {
    try { await fn(); setSave(okMsg); await pullBuilds(); await pullBuild(state.build); }
    catch (e) { setSave(e.message || "Didn't work; try again", true); }
  };
  frag.append(el("div", { class: "stephead" }, el("h2", {}, "Team"), el("span", { class: "status" }, b.name || "")));
  frag.append(el("p", {}, "People on this build see it in their Build list once they sign in with the email you add here. Editors can tick steps and record measurements; viewers can only look. Every tick records who made it."));
  const ul = el("ul", { class: "team" });
  for (const m of state.members || []) {
    const li = el("li", {}, el("span", { class: "em" }, m.email + (m.email === state.me ? " (you)" : "")), el("span", { class: "role" }, m.role));
    if (owner && m.role !== "owner") {
      const sel = el("select", { "aria-label": "Role for " + m.email });
      for (const r of ["editor", "viewer"]) { const o = el("option", { value: r }, r); if (r === m.role) o.selected = true; sel.append(o); }
      sel.addEventListener("change", () => act(() => api(`builds/${state.build}/members`, { method: "POST", body: JSON.stringify({ email: m.email, role: sel.value }) }), "Role changed"));
      li.append(sel, el("button", { type: "button", class: "btn", onclick: () => act(() => api(`builds/${state.build}/members/${encodeURIComponent(m.email)}`, { method: "DELETE" }), "Removed " + m.email) }, "Remove"));
    }
    if (!owner && m.email === state.me) {
      li.append(el("button", { type: "button", class: "btn", onclick: () => act(async () => {
        await api(`builds/${state.build}/members/${encodeURIComponent(m.email)}`, { method: "DELETE" });
        delete state.builds[state.build]; selectBuild(Object.keys(state.builds)[0] || null);
      }, "You left the build") }, "Leave this build"));
    }
    ul.append(li);
  }
  frag.append(ul);
  if (owner) {
    const em = el("input", { id: "addEmail", type: "email", placeholder: "name@example.com", autocomplete: "off" });
    const role = el("select", { id: "addRole" }, el("option", { value: "editor" }, "editor"), el("option", { value: "viewer" }, "viewer"));
    frag.append(el("h4", {}, "Add someone"));
    frag.append(el("div", { class: "formrow" }, el("label", { class: "f", for: "addEmail" }, "Email", em),
      el("label", { class: "f", for: "addRole", style: "flex: 0 0 auto" }, "Role", role),
      el("button", { type: "button", class: "btn primary", onclick: () => {
        const v = em.value.trim(); if (!v) return em.focus();
        act(() => api(`builds/${state.build}/members`, { method: "POST", body: JSON.stringify({ email: v, role: role.value }) }), "Shared with " + v);
      } }, "Share")));
    const nm = el("input", { id: "renameInp", type: "text", value: b.name || "" });
    frag.append(el("h4", {}, "This build"));
    frag.append(el("div", { class: "formrow" }, el("label", { class: "f", for: "renameInp" }, "Name", nm),
      el("button", { type: "button", class: "btn", onclick: () => act(() => api(`builds/${state.build}`, { method: "PATCH", body: JSON.stringify({ name: nm.value }) }), "Renamed") }, "Rename")));
    const del = el("button", { type: "button", class: "btn danger" }, "Delete this build");
    del.addEventListener("click", () => {
      if (del.dataset.armed) {
        act(async () => { await api(`builds/${state.build}`, { method: "DELETE" }); delete state.builds[state.build]; selectBuild(Object.keys(state.builds)[0] || null); }, "Build deleted");
      } else { del.dataset.armed = "1"; del.textContent = "Delete it and all its progress, for everyone? Click again"; }
    });
    frag.append(del);
  }
  return frag;
}

/* ----------------------------------------------------------------- events */
$("buildSel").addEventListener("change", e => selectBuild(e.target.value));
$("newBuildBtn").addEventListener("click", () => {
  state.build = null; unsubs.forEach(u => u()); unsubs = []; state.steps = {}; render();
  const i = $("newName"); if (i) { i.value = "Station " + String(Object.keys(state.builds).length + 1).padStart(3, "0"); i.focus(); i.select(); }
});
document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab; try { localStorage.setItem("forsyth-asm-tab", state.tab); } catch (e) {} render();
}));
$("drawerBtn").addEventListener("click", () => $("stepList").classList.toggle("open"));
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (BY_ID[id] && id !== state.current) go(id); });
document.addEventListener("keydown", e => {
  if (state.tab !== "steps" || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || "")) return;
  const i = STEPS.findIndex(s => s.id === state.current);
  if (e.key === "ArrowRight" && i < STEPS.length - 1) go(STEPS[i + 1].id);
  if (e.key === "ArrowLeft" && i > 0) go(STEPS[i - 1].id);
});
boot();
</script>
</body></html>
